[project]
name = ""
description = ""
authors = [
  {name = "Sam Crawford", email="samlkc@proton.me"},
  {name = "Bora Tascan", email="botascan@gmail.com"}
]

requires-python = ">=3.14"

[tool.ruff]
line-length = 88 # default

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle
    "F",      # pyflakes
    "FLY",    # flynt
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "N",      # pep8-naming
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint rules
    "RET",    # return rules
    "RUF",    # ruff-native rules
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "UP"      # pyupgrade
]
ignore = [
    "S311",  # Don't use non-cryptographic PRNG
    "PTH123", # Use Path.open() over open()
    "PLR2004", # Magic value used in comparison, ...
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed in tests...
    "ANN",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.basedpyright]
typeCheckingMode = "basic"
